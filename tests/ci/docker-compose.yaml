# A throwaway shop that installs dist/smailyforprestashop.zip on start. validate.sh drives it, and
# runs the tests from the repository, which is mounted at /smaily.
services:
  prestashop:
    image: ${PS_IMAGE:-prestashop/prestashop-flashlight:9.2.0-nginx}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PS_DOMAIN=localhost:${CI_PORT:-8000}
      - INSTALL_MODULES_DIR=/ps-modules
    volumes:
      - ../../dist:/ps-modules:ro
      - ./api-client-smoke.php:/tests/api-client-smoke.php:ro
      - ../..:/smaily
    ports:
      - ${CI_PORT:-8000}:80
    # The shop never reaches the receiver of the installation report, nor GitHub, which the
    # module's update check asks for the newest release: both names answer inside the shop
    # container.
    extra_hosts:
      - subscription.smaily.com:127.0.0.1
      - api.github.com:127.0.0.1

  mysql:
    image: mariadb:lts
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      - MYSQL_USER=prestashop
      - MYSQL_PASSWORD=prestashop
      - MYSQL_ROOT_PASSWORD=prestashop
      - MYSQL_DATABASE=prestashop
