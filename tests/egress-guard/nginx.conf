# A second nginx in the shop container (install.sh): the TLS front of the Smaily mock for every
# *.sendsmaily.net name, the TLS front of the engine mock for intelligence.smaily.com, and the TLS
# front of the subscription mock for subscription.smaily.com.
pid /tmp/smaily-mock/nginx.pid;
error_log /tmp/smaily-mock/nginx-error.log;
events {}
http {
    access_log off;
    client_body_temp_path /tmp/smaily-mock/body;
    proxy_temp_path /tmp/smaily-mock/proxy;
    server {
        listen 127.0.0.1:8443 ssl;
        server_name ~^.+\.sendsmaily\.net$;
        ssl_certificate /tmp/smaily-mock/leaf.pem;
        ssl_certificate_key /tmp/smaily-mock/leaf.key;
        location / {
            proxy_pass http://127.0.0.1:8099;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 127.0.0.1:8444 ssl;
        server_name intelligence.smaily.com;
        ssl_certificate /tmp/smaily-mock/engine.pem;
        ssl_certificate_key /tmp/smaily-mock/engine.key;
        location / {
            proxy_pass http://127.0.0.1:8098;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 127.0.0.1:8445 ssl;
        server_name subscription.smaily.com;
        ssl_certificate /tmp/smaily-mock/subscription.pem;
        ssl_certificate_key /tmp/smaily-mock/subscription.key;
        location / {
            proxy_pass http://127.0.0.1:8097;
            proxy_set_header Host $host;
            # The mock can be told to wait longer than the module does.
            proxy_read_timeout 120s;
        }
    }
}
