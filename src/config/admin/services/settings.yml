# The JSON endpoints of the Settings page. Each controller names its class: PrestaShop 8.0 does not
# take a service's class from its id.
services:
  _defaults:
    public: true
    autowire: true
    autoconfigure: true

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\SaveTab:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\SaveTab

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\TestConnection:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\TestConnection

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\ChangeLayout:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\ChangeLayout

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Workflows:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Workflows

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\DiscountRules:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\DiscountRules

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\EngineAutomationsCard:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\EngineAutomationsCard

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\SaveEngineAutomations:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\SaveEngineAutomations

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\EngineExchange:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\EngineExchange

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\EnginePing:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\EnginePing

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\EngineDisconnect:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\EngineDisconnect

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\BackfillState:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\BackfillState

  PrestaShop\Module\SmailyForPrestaShop\Admin\Api\BackfillAction:
    class: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\BackfillAction
