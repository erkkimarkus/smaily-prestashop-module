# The JSON endpoints of the Initial setup (Admin\Api\Setup). Their rights are those of the Initial
# setup's menu tab.
smailyforprestashop_api_setup_save:
  path: /smailyforprestashop/api/setup/save
  methods: [POST]
  defaults:
    _controller: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Setup\SaveStep::execute
    _legacy_controller: AdminSmailyConnectSetup

# The store-layout bar's Change: the same change as on Settings (Admin\Settings\LayoutChange).
smailyforprestashop_api_setup_layout:
  path: /smailyforprestashop/api/setup/layout
  methods: [POST]
  defaults:
    _controller: PrestaShop\Module\SmailyForPrestaShop\Admin\Api\Settings\ChangeLayout::execute
    _legacy_controller: AdminSmailyConnectSetup

