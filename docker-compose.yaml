services:
  prestashop:
    image: ${PS_IMAGE:-prestashop/prestashop-flashlight:9.2.0-nginx}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
    - PS_DOMAIN=localhost:${PS_PORT:-8080}
    - DEBUG_MODE=true
    ports:
    - ${PS_PORT:-8080}:80
    volumes:
    - prestashop-data:/var/www/html
    - .vscode:/var/www/html/.vscode
    - ./src:/var/www/html/modules/smailyforprestashop
    - ./post-scripts:/tmp/post-scripts
    - .:/smaily:ro

  mysql:
    image: mariadb:lts
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 10s
      retries: 5
    environment:
    - MYSQL_HOST=mysql
    - MYSQL_USER=prestashop
    - MYSQL_PASSWORD=prestashop
    - MYSQL_ROOT_PASSWORD=prestashop
    - MYSQL_PORT=3306
    - MYSQL_DATABASE=prestashop
    ulimits:
      nproc: 65535
      nofile:
        soft: 26677
        hard: 46677
    volumes:
    - prestashop-db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
    - mysql
    environment:
    - PMA_HOST=mysql
    - PMA_PORT=3306
    - PMA_USER=prestashop
    - PMA_PASSWORD=prestashop
    - MYSQL_ROOT_PASSWORD=prestashop
    ports:
    - ${PMA_PORT:-8888}:80

  mailhog:
    image: mailhog/mailhog:latest
    ports:
    - ${MAILHOG_PORT:-8025}:8025

volumes:
  prestashop-data:
  prestashop-db-data:
